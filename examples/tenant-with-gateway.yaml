apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-tenant
  namespace: minio-tenant
spec:
  ## Add metadata to the all pods created by the StatefulSet
  metadata:
    labels:
      app: minio
    annotations:
      prometheus.io/path: /minio/v2/metrics/cluster
      prometheus.io/port: "9000"
      prometheus.io/scrape: "true"

  ## Registry location and Tag to download MinIO Server image
  image: quay.io/minio/minio:RELEASE.2024-01-01T16-36-33Z
  imagePullPolicy: IfNotPresent

  ## Secret with credentials to be used by MinIO Tenant.
  ## Refers to the secret object created above.
  configuration:
    name: minio-env-configuration
  
  ## Specification for MinIO Pool(s) in this Tenant.
  pools:
    - servers: 4
      name: pool-0
      volumesPerServer: 4
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
      ## Configure resource requests and limits for MinIO containers
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: 1000m
          memory: 4Gi
      ## Configure security context for MinIO containers
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

  ## Mount path where PV will be mounted inside container(s).
  mountPath: /export

  ## Sub path inside Mount path where MinIO stores data.
  subPath: /data

  ## Enable automatic Kubernetes based certificate generation and signing as explained in
  ## https://kubernetes.io/docs/tasks/tls/managing-tls-in-a-cluster
  requestAutoCert: true

  ## Enable S3 specific features such as Bucket DNS which would allow `buckets` to be
  ## accessible as DNS entries of form `<bucketname>.minio.default.svc.cluster.local`
  features:
    bucketDNS: false
    enableSFTP: false
    ## Enable Envoy Gateway for automatic load balancing and routing
    enableGateway: true
    ## Number of Envoy Gateway replicas (optional, defaults to 2)
    gatewayReplicas: 2

  ## PodManagement policy for pods created by StatefulSet. Can be "OrderedReady" or "Parallel"
  ## Refer https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/#pod-management-policy
  ## for details.
  podManagementPolicy: Parallel

  ## serviceMetadata allows passing additional labels and annotations to MinIO and Console specific
  ## services created by the operator.
  serviceMetadata:
    minioServiceLabels:
      label: minio-svc
    minioServiceAnnotations:
      v2.min.io: minio-svc
    consoleServiceLabels:
      label: console-svc
    consoleServiceAnnotations:
      v2.min.io: console-svc

  ## Add environment variables to be set in MinIO container (https://github.com/minio/minio/tree/master/docs/config)
  env:
    - name: MINIO_BROWSER_REDIRECT_URL
      value: https://console.example.com

  ## Configure certificate for MinIO Tenant pods
  ## This is a list of secrets that will be used to configure TLS for MinIO Tenant pods
  ## The secrets should be created in the same namespace as the Tenant
  # externalCertSecret:
  #   - name: minio-tls
  #     type: kubernetes.io/tls

  ## Configure certificate for KES (Key Encryption Service)
  # externalClientCertSecret:
  #   name: kes-client-cert
  #   type: kubernetes.io/tls

---
apiVersion: v1
kind: Secret
metadata:
  name: minio-env-configuration
  namespace: minio-tenant
type: Opaque
stringData:
  config.env: |-
    export MINIO_ROOT_USER="minio"
    export MINIO_ROOT_PASSWORD="minio123"
    export MINIO_STORAGE_CLASS_STANDARD="EC:2"

